<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="DJoz Template">
    <meta name="keywords" content="DJoz, unica, creative, html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Moodsync🎶</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Css Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}" type="text/css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome.min.css') }}" type="text/css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/barfiller.css') }}" type="text/css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nowfont.css') }}" type="text/css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/rockville.css') }}" type="text/css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/magnific-popup.css') }}" type="text/css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/owl.carousel.min.css') }}" type="text/css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/slicknav.min.css') }}" type="text/css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" type="text/css">
</head>

<body>
    <!-- Page Preloder -->
    <div id="preloder">
        <div class="loader"></div>
    </div>

    <!-- Header Section Begin -->
    <header class="header">
        <div class="container">
            <div class="row">
                <div class="col-lg-2 col-md-2">
                    <div class="header__logo">
                        <a href="{{ url_for('index', filename='index.html') }}"><img src="{{ url_for('static', filename='img/mood-sync-logo.png') }}" alt=""></a>
                    </div>
                </div>
                <div class="col-lg-10 col-md-10">
                    <div class="header__nav">
                        <nav class="header__menu mobile-menu">
                            <ul>
                                <li class="active"><a href="{{ url_for('index', filename='index.html') }}">Home</a></li>
                                <li><a href="{{ url_for('songs', filename='songs.html') }}">Music Player</a></li>
                                
                        </nav>
                        <div class="header__right__social">
                            <a href="#"><i class="fa fa-facebook"></i></a>
                            <a href="#"><i class="fa fa-twitter"></i></a>
                            <a href="#"><i class="fa fa-instagram"></i></a>
                            <a href="#"><i class="fa fa-dribbble"></i></a>
                        </div>
                    </div>
                </div>
            </div>
            <div id="mobile-menu-wrap"></div>
        </div>
    </header>

    <!-- Hero Section Begin -->
    <section class="hero spad set-bg" data-setbg="{{ url_for('static', filename='img/hero-bg.png') }}">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="hero__text">
                        <span>Discover Your Mood Playlist</span>
                        <h1>Feel the heart beats</h1>
                        <p>Music that adapts to your emotions. Our AI analyzes your mood through facial expressions 
      and curates the perfect playlist to match your vibe. No words needed - just feel the music. Click on play button!</p>
                        <a href="{{ url_for('songs', filename='songs.html') }}"><i class="fa fa-play"></i></a>
                    </div>
                </div>
            </div>
        </div>
        <div class="linear__icon">
            <i class="fa fa-angle-double-down"></i>
        </div>
    </section>

    

    

    <script>
document.addEventListener('DOMContentLoaded', function() {
    // Check Spotify auth status when page loads
    fetch('/check_spotify_auth')
        .then(response => response.json())
        .then(data => {
            if (data.authenticated) {
                document.getElementById('auth-status').textContent = "Connected to Spotify";
                document.getElementById('connect-btn').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'block';
            }
        });
    
    // Handle connect button click
    document.getElementById('connect-btn').addEventListener('click', function() {
        window.location.href = "{{ url_for('songs') }}";
    });
});
</script>

    <!-- Js Plugins -->
    <script src="{{ url_for('static', filename='js/jquery-3.3.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.magnific-popup.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.nicescroll.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.barfiller.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.countdown.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.slicknav.js') }}"></script>
    <script src="{{ url_for('static', filename='js/owl.carousel.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <!-- Music Plugin -->
    <script src="{{ url_for('static', filename='js/jquery.jplayer.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jplayerInit.js') }}"></script>
</body>
</html>
